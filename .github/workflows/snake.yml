name: Snake

on:
  schedule:
    - cron: "43 4 * * *" # every day, 04:43 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draw the snake from the contribution graph
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#f4a18b&color_dots=#ebedf0,#c6d0f5,#a3b3ec,#6d7fd6,#3a5a8a
            dist/snake-dark.svg?palette=github-dark&color_snake=#f4a18b&color_dots=#1e232b,#2b3a5c,#3a5a8a,#6d7fd6,#a9c7f0

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
